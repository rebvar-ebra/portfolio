name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir web test
      - run: pnpm --dir web typecheck
      - run: pnpm --dir web lint
      - run: pnpm --dir web build
      - run: docker compose config --quiet
      - run: docker compose build

  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: checks
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: e2e/requirements.txt
      - run: pip install -r e2e/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: docker compose up --build --wait -d
      - run: CHROME_PATH= E2E_BASE_URL=http://127.0.0.1:3000 python e2e/smoke.py
      - if: always()
        run: docker compose logs --no-color
      - if: always()
        uses: actions/upload-artifact@v5
        with:
          name: browser-screenshots
          path: artifacts/e2e
      - if: always()
        run: docker compose down -v
