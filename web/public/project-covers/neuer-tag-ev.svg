<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Neuer Tag e.V. website cover</title>
  <desc id="desc">Editorial composition inspired by the Neuer Tag visual identity</desc>
  <rect width="1200" height="900" fill="#faf9f8"/>
  <circle cx="1060" cy="108" r="250" fill="#fc4e13"/>
  <circle cx="128" cy="780" r="260" fill="#590027"/>
  <path d="M760 900C760 670 945 484 1175 484h25v416Z" fill="#f1efed"/>
  <g transform="translate(120 150)">
    <text x="0" y="0" fill="#590027" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" letter-spacing="3">NEUER TAG E.V.</text>
    <text x="0" y="118" fill="#1f1f1f" font-family="Arial, Helvetica, sans-serif" font-size="82" font-weight="700">
      <tspan x="0" dy="0">Miteinander.</tspan>
      <tspan x="0" dy="96">Füreinander.</tspan>
    </text>
    <text x="0" y="360" fill="#6b6b6b" font-family="Arial, Helvetica, sans-serif" font-size="28">Gemeinsam stark für eine bunte Gesellschaft.</text>
