    <text x="112" y="464" text-anchor="middle" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">LIVE WEBSITE</text>
  </g>
  <g transform="translate(760 550) rotate(-8)">
    <rect width="320" height="225" rx="20" fill="#fff" stroke="#e0ddda" stroke-width="4"/>
    <rect x="28" y="30" width="92" height="12" rx="6" fill="#590027"/>
    <rect x="28" y="70" width="240" height="18" rx="9" fill="#1f1f1f"/>
    <rect x="28" y="104" width="188" height="10" rx="5" fill="#ae8092"/>
    <rect x="28" y="142" width="108" height="44" rx="22" fill="#fc4e13"/>
  </g>
